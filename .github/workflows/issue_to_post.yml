name: Issue to Post Converter

on:
  issues:
    types: [opened, edited, labeled, deleted, closed]

jobs:
  build:
    if: contains(github.event.issue.labels.*.name, 'article')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install marked

      - name: Process Issues and Generate Files
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const marked = require('marked');

            // 获取所有带 article 标签的 Issue
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'article',
              state: 'open'
            });

            const templatePath = 'components/post.html';
            let template = fs.readFileSync(templatePath, 'utf8');
            
            // 严谨修复：确保模板内部的资源也是绝对路径
            template = template.replace(/href="static/g, 'href="/static').replace(/src="static/g, 'src="/static');

            for (const issue of issues.data) {
              const postDir = path.join('post', issue.number.toString());
              if (!fs.existsSync(postDir)) fs.mkdirSync(postDir, { recursive: true });

              // 此处不注入具体内容，由 script.js 在前端根据 manifest 动态渲染
              // 但生成该文件是为了让 GitHub Pages 在访问 /post/数字 时不返回 404
              // 我们直接拷贝 index.html 作为底板，或者生成一个带标记的模板
              fs.writeFileSync(path.join(postDir, 'index.html'), fs.readFileSync('index.html', 'utf8'));
            }

            // 生成供前端使用的清单
            fs.writeFileSync('manifest.json', JSON.stringify({ items: issues.data }, null, 2));

      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add post/ manifest.json
          git commit -m "Auto-generate post directories and manifest" || echo "No changes"
          git push