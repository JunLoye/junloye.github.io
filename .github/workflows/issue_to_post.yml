name: Issue to Post Converter

on:
  issues:
    types: [opened, edited, labeled, deleted, closed]
  workflow_dispatch: # 允许手动触发

jobs:
  build:
    # 只有包含 article 标签才运行
    if: contains(github.event.issue.labels.*.name, 'article') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install marked

      - name: Process Issues and Generate Files
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const marked = require('marked');

            // 获取所有带 article 标签的 Issue
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'article',
              state: 'open'
            });

            // 1. 读取首页作为模板，确保样式一致
            const indexTemplate = fs.readFileSync('index.html', 'utf8');

            // 2. 清理旧的 post 目录（可选，确保同步）
            if (fs.existsSync('post')) {
              // 仅删除数字目录
              const dirs = fs.readdirSync('post');
              dirs.forEach(d => {
                if(/^\d+$/.test(d)) fs.rmSync(path.join('post', d), {recursive: true, force: true});
              });
            }

            for (const issue of issues) {
              const postDir = path.join('post', issue.number.toString());
              if (!fs.existsSync(postDir)) fs.mkdirSync(postDir, { recursive: true });

              // 将 index.html 复制到 post/数字/index.html
              // 前端 JS 会通过 URL 识别并自动加载内容
              fs.writeFileSync(path.join(postDir, 'index.html'), indexTemplate);
              console.log(`Generated: ${postDir}/index.html`);
            }

            // 3. 生成清单文件
            fs.writeFileSync('manifest.json', JSON.stringify({ items: issues }, null, 2));

      - name: Commit and Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add post/ manifest.json
          # 如果没有变化则不提交，避免报错
          git diff --quiet && git diff --staged --quiet || (git commit -m "docs: auto generate posts from issues" && git push)