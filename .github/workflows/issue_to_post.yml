name: Issue to Post Converter

on:
  issues:
    types: [opened, edited, labeled]

jobs:
  build:
    # 只有当 issue 包含 "article" 标签时才运行（可选，防止普通反馈也被转成文章）
    if: contains(github.event.issue.labels.*.name, 'article')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install marked

      - name: Generate Post HTML
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marked = require('marked');

            const issue = context.payload.issue;
            const issueNumber = issue.number;
            const issueTitle = issue.title;
            const issueBody = issue.body;

            // 将 Markdown 转为 HTML
            const htmlContent = marked.parse(issueBody);

            // 读取你的模板文件 post.html
            let template = fs.readFileSync('components/post.html', 'utf8');

            // 这里的逻辑是将内容注入到模板中
            // 假设你在 post.html 中有一个 <div id="detail-content-area"></div>
            // 我们通过字符串替换的方式填充内容
            const finalHtml = template.replace(
              '<div id="detail-content-area"></div>',
              `<div id="detail-content-area">
                <h1>${issueTitle}</h1>
                <div class="markdown-body">${htmlContent}</div>
              </div>`
            );

            // 确保目录存在
            if (!fs.existsSync('post')) {
              fs.mkdirSync('post');
            }

            // 写入文件，例如 post/1.html
            fs.writeFileSync(`post/${issueNumber}.html`, finalHtml);
            console.log(`Successfully generated post/${issueNumber}.html`);

      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add post/*.html
          git commit -m "Auto-generate post from issue #${{ github.event.issue.number }}" || echo "No changes to commit"
          git push