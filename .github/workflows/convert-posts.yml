# ===== GitHub Actions: 博客文章URL转换工作流 =====
# 功能：当有新 Issue 被创建/发布时，自动将其转换为博客文章链接格式
# - 生成 /post/{issue_number} 格式的规范URL
# - 兼容旧的 ?post={number} 格式
# - 筛选规则：只处理作者本人创建的、非"反馈"标签的、状态为 open 的 Issue

name: Convert Posts to Web URLs

on:
  issues:
    types: [opened, reopened, labeled, unlabeled]
  issue_comment:
    types: [created, edited]

jobs:
  add-post-url-comment:
    if: >
      github.event.issue.state == 'open' &&
      github.event.issue.user.login == github.repository_owner &&
      !contains(github.event.issue.labels.*.name, '反馈')
    runs-on: ubuntu-latest
    steps:
      - name: Add Post URL as Issue Comment
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = context.issue.number;
            const owner = context.repo.owner;
            const postUrl = `https://${owner}.github.io/?post=${issueNumber}`;

            const comments = await github.rest.issues.listComments({
              issue_number: issueNumber,
              owner: context.repo.owner,
              repo: context.repo.repo
            });

            const botComment = comments.data.find(c =>
              c.user.type === 'Bot' && c.body && c.body.includes('博客文章链接')
            );

            if (!botComment) {
              await github.rest.issues.createComment({
                issue_number: issueNumber,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `## 📝 博客文章链接\n\n您的文章已自动生成以下链接：\n\n**文章链接：** [${postUrl}](${postUrl})\n\n> 请使用 \`?post={文章编号}\` 格式访问`
              });
            }
