<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name='description' content='Jun Loye 的个人博客，分享编程技术、生活点滴与思考。涵盖技术、算法与数据结构等内容'>
    <meta name="google-site-verification" content="fJ753iyaVnQymPQwrMoRVIqYPbswugSIkqtD1DwmEFg">

    <title>Blog | Jun Loye</title>
    <link rel="icon" href="image/favicon.ico" type="image/x-icon">

    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/music-player.css">
    <link rel="stylesheet" href="/static/css/publish.css">
    <link rel="stylesheet" href="/static/css/post.css">
    <link rel="stylesheet" href="/static/css/markdown-body.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.2.0/github-markdown.min.css" defer>
</head>
<body data-theme="light">
    <div id="notification-container"></div>
    <button id="theme-toggle-btn" onclick="toggleDarkMode()"><svg id="theme-icon" viewBox="0 0 24 24"></svg></button>

    <aside class="sidebar-info" id="sidebar-info">
        <div class="sidebar-header">
            <span class="sidebar-title">Blog Info</span>
        </div>
        <div class="sidebar-content">
            <div class="info-item">
                <span class="info-label">博文总数</span>
                <span class="info-value" id="sidebar-post-count">-</span>
            </div>
            <div class="info-item">
                <span class="info-label">运行时间</span>
                <span class="info-value" id="sidebar-run-time">-</span>
            </div>
            <div class="info-item">
                <span class="info-label">您的 IP</span>
                <span class="info-value" id="sidebar-ip">-</span>
            </div>
            <div class="info-item">
                <span class="info-label">Version</span>
                <span class="info-value" id="sidebar-version">-</span>
            </div>
        </div>
    </aside>

    <nav>
        <div class="brand" onclick="location.reload()">
            JUN LOYE
        </div>
        
        <div class="nav-right">
            <span class="settings-trigger" onclick="openSettings()">SETTINGS</span>
            <span class="about-trigger" onclick="openAbout()">ABOUT</span>
            <span class="publish-trigger" onclick="openPublishModal()">PUBLISH</span>

            <input type="text" id="search-input" placeholder="搜索文章...">
        </div>
    </nav>

    <div id="publish-modal" class="overlay"></div>
    <div id="about-overlay" class="overlay"></div>
    <div id="post-overlay" class="overlay"></div>

    <main class="post-grid" id="post-list-container"></main>

    <div class="music-player-container">
        <div class="playlist-menu" id="playlist-menu"></div>
        <div id="player-bar" class="music-player">
            <div class="music-info" onclick="togglePlaylist()"><span id="track-name" style="font-size: 0.75rem; font-weight: 600;">Music</span></div>
            <div class="disc" id="music-btn"><svg viewBox="0 0 24 24"><path id="btn-icon-path" d="M8 5v14l11-7z"/></svg></div>
            <audio id="bg-audio"></audio>
        </div>
    </div>

    <div id="cookie-banner" class="cookie-banner">
        <div class="cookie-content">
            <div class="cookie-text">
                <h3>Cookie 偏好设置</h3>
                <p>我们使用 Cookie 来提升您的浏览体验并分析网站流量。点击“全部接受”表示您同意我们的存储政策。</p>
            </div>
            <div class="cookie-actions">
                <button onclick="setCookiePreference('denied')" class="cookie-btn secondary">仅必要</button>
                <button onclick="setCookiePreference('accepted')" class="cookie-btn primary">全部接受</button>
            </div>
        </div>
    </div>

    <footer>
        <p>© <span id="year"></span> JUN LOYE</p>
    </footer>

    <script src="/static/js/login.js"></script>
    <script src="/static/js/music-player.js"></script>
    <script src="/static/js/search.js"></script>
    <script src="/static/js/theme.js"></script>
    <script src="/static/js/post.js"></script>
    <script src="/static/js/about.js"></script>
    <script src="/static/js/publish.js"></script>
    <script src="/static/js/script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</body>
</html>
