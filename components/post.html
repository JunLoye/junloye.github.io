<div class="detail-post" id="post-content">
    <div class="progress-bar-container">
        <div class="progress-bar" id="reading-progress"></div>
    </div>
    <button class="close-btn" onclick="closePost()">← CLOSE</button>
    <div class="post-action-buttons">
        <button class="history-toggle-btn" id="history-toggle-btn" onclick="openHistoryModal()" style="display: none;">
            <svg viewBox="0 0 24 24" width="16" height="16">
                <path fill="currentColor" d="M13 3a9 9 0 0 0-9 9H1l4 3.99L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42A8.954 8.954 0 0 0 13 21a9 9 0 0 0 0-18zm-1 5v5l4.25 2.52.77-1.28-3.52-2.09V8H12z"/>
            </svg>
            <span class="history-toggle-text">编辑历史</span>
            <span class="history-toggle-count" id="history-count"></span>
        </button>
        <a id="edit-post-btn" class="edit-btn" target="_blank" style="display: none; text-decoration: none;">纠错 / 反馈</a>
    </div>
    <div id="post-toc" class="post-toc"></div>
    <div class="detail-container" id="content-area"></div>

    <!-- 编辑历史记录弹窗 -->
    <div class="history-modal-overlay" id="history-modal" style="display: none;">
        <div class="history-modal-container">
            <div class="history-modal-header">
                <div class="history-modal-title">
                    <svg viewBox="0 0 24 24" width="20" height="20">
                        <path fill="currentColor" d="M13 3a9 9 0 0 0-9 9H1l4 3.99L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42A8.954 8.954 0 0 0 13 21a9 9 0 0 0 0-18zm-1 5v5l4.25 2.52.77-1.28-3.52-2.09V8H12z"/>
                    </svg>
                    <span>编辑历史</span>
                    <span class="history-modal-count" id="history-modal-count"></span>
                </div>
                <button class="history-modal-close" onclick="closeHistoryModal()" title="关闭">
                    <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
                </button>
            </div>
            <div class="history-modal-body" id="history-list">
                <div class="history-loading">
                    <div class="history-spinner"></div>
                    <span>加载编辑历史...</span>
                </div>
            </div>
        </div>
    </div>

    <script src="post.js"></script>
</div>
