<!-- archive.html -->
<button class="close-btn" onclick="closeArchive()">← 返回</button>
<div class="detail-container" id="archive-content">
    <div class="archive-wrapper">
        <div class="archive-header">
            <div class="archive-header-icon">
                <svg viewBox="0 0 24 24" width="32" height="32">
                    <path fill="currentColor" d="M20.54 5.23l-1.39-1.68C18.88 3.21 18.47 3 18 3H6c-.47 0-.88.21-1.16.55L3.46 5.23C3.17 5.57 3 6.02 3 6.5V19c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V6.5c0-.48-.17-.93-.46-1.27zM6.24 5h11.52l.81.97H5.44l.8-.97zM5 19V8h14v11H5z"/>
                    <path fill="currentColor" d="M8 10h8v2H8zm0 4h8v2H8z"/>
                </svg>
            </div>
            <div>
                <h1>文章归档</h1>
                <p class="archive-subtitle">按时间轴浏览所有博文</p>
            </div>
        </div>

        <div class="archive-summary">
            <div class="archive-stat-card">
                <span class="archive-stat-value" id="archive-total-posts">-</span>
                <span class="archive-stat-label">总文章数</span>
            </div>
            <div class="archive-stat-card">
                <span class="archive-stat-value" id="archive-total-tags">-</span>
                <span class="archive-stat-label">标签数</span>
            </div>
            <div class="archive-stat-card">
                <span class="archive-stat-value" id="archive-total-years">-</span>
                <span class="archive-stat-label">覆盖年份</span>
            </div>
        </div>

        <div class="archive-timeline" id="archive-timeline">
            <div class="archive-loading">
                <div class="archive-spinner"></div>
                <span>正在加载归档数据...</span>
            </div>
        </div>
    </div>
</div>
